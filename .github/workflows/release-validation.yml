name: Release validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: npm test
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_schemas.py
      - run: python scripts/run_notebook.py tags_analysis.ipynb
      - run: node scripts/verify-checksums.mjs
